<!-- member.html -->
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>member.html</title>
</head>
<body>
<table border="1" style="background-color: #e3ffff;">
	<thead>
		<tr align="left">
			<th colspan="3" style="background-color: #7847ff;">회원가입</th>
		</tr>
	</thead>
	<!-- ============================ -->
	<tbody>
		<tr>
			<td>아이디</td>
			<td><input name="id" type="id"> <button>ID중복확인</button> </td>
			<td>아이디를 적어 주세요.</td>
		</tr>	
	<!-- ============================ -->
		<tr>
			<td>비밀번호</td>
			<td><input name="pwd" type="password"></td>
			<td>비밀번호를 적어 주세요.</td>
		</tr>	
	<!-- ============================ -->
		<tr>
			<td>비밀번호 확인</td>
			<td><input name="pwd" type="password"></td>
			<td>비밀번호를 확인합니다.</td>
		</tr>	
	<!-- ============================ -->
		<tr>
			<td>이름</td>
			<td><input name="user_name"></td>
			<td>이름을 적어 주세요.</td>
		</tr>	
	<!-- ============================ -->
		<tr>
			<td>성별</td>
			<td>
				<label><input type="radio" name="gender" value="man">남</label>
    			<label><input type="radio" name="gender" value="woman">여</label>
			</td>
			<td>성별을 선택 하세요.</td>
		</tr>	
	<!-- ============================ -->
		<tr>
			<td>생년월일</td>
			<td><input name="birthday" style="width:90px;"><a>ex)830815</a></td>
			<td>생년월일을 적어 주세요.</td>
		</tr>	
	<!-- ============================ -->
		<tr>
			<td>Email</td>
			<td><input name="email" type="email" style="width:200px;"></td>
			<td>이메일을 적어 주세요.</td>
		</tr>	
	<!-- ============================ -->
		<tr>
			<td>우편번호</td>
			<td><input name="postnum" style="width:80px;"> <button>우편번호찾기</button></td>
			<td>우편번호를 검색하세요.</td>
		</tr>	
	<!-- ============================ -->
		<tr>
			<td>주소</td>
			<td><input name="addr" style="width:400px;"></td>
			<td>주소를 적어 주세요.</td>
		</tr>	
	<!-- ============================ -->
		<tr>
			<td>취미</td>
			<td>
			<label><input type="checkbox" name="hobby" id="internet" value="internet">인터넷</label>
		    <label><input type="checkbox" name="hobby" id="travel" value="travel">여행</label>
		    <label><input type="checkbox" name="hobby" id="game" value="game">게임</label>
		    <label><input type="checkbox" name="hobby" id="movie" value="movie">영화</label>
		    <label><input type="checkbox" name="hobby" id="exercise" value="exercise">운동</label>
			</td>
			<td>주소를 적어 주세요.</td>
		</tr>	
	<!-- ============================ -->
		<tr>
			<td>직업</td>
			<td>
				<select name="job" id="job">
				    <option>선택하세요.</option>
				    <option value="student">학생</option>
				    <option value="developer">개발자</option>
				    <option value="office-worker">직장인</option>
				</select>
			</td>
			<td>직업을 선택 하세요</td>
		</tr>	
	<!-- ============================ -->
		<tr align="center">
			<td colspan="3"><button>회원가입</button> <button>다시쓰기</button> <button>로그인</button></td>
		</tr>	
	<!-- ============================ -->
	</tbody>
</table>
</body>
</html>
