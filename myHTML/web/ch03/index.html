<!-- index.html 주석 다는 방법 "<!--" 적으면 자동으로 적힘 -->
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
<h1>웹 문서 만들기</h1>
<hr>
<!-- ctrl + space: 자동완성 단축키 -->
<p>HTML</p>
<!-- ctrl + alt  + 방향키: 현재 커서 한 줄 복사 -->
<p>CSS</p>
<p>Javascript</p>
</body>
</html>
