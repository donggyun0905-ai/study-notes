<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>제목입력</title>
</head>
<body>
<!--=========================================-->
<table border="1">
	<tr align="center">
		<th width="50">번호</th>
		<th width="100">배달상태</th>
		<th width="150">주문메뉴</th>
		<th width="50">수량</th>
		<th width="150">픽업/배달</th>
	</tr>

<!--================= 1 ======================-->
	<tr align="center">
		<td rowspan="3">1</td><!--주문번호-->
		<td rowspan="3">1</td><!--배달상태-->
		<td>햄버거</td><!--주문메뉴-->
		<td>1</td><!--수량-->
		<td rowspan="3">빨랑 갖다주세요</td><!--픽업/배달-->
	</tr>
	<tr align="center">
		<td>콜라</td>
		<td>2</td>
	</tr>
	<tr align="center">
		<td>감자튀김</td>
		<td>2</td>
	</tr>

<!--================= 2 ======================-->

	<tr align="center">
		<td rowspan="2">2</td> <!--주문번호-->
		<td rowspan="2">1</td> <!--배달상태-->
		<td>햄버거</td><!--주문메뉴-->
		<td>1</td><!--수량-->
		<td rowspan="2">10시 주문</td><!--픽업/배달-->
	</tr>
	<tr align="center">
		<td>콜라</td>
		<td>2</td>
	</tr>

<!--================= 3 ======================-->
	<tr align="center">
		<td rowspan="2">3</td><!--주문번호-->
		<td rowspan="2">1</td><!--배달상태-->
		<td>콜라</td><!--주문메뉴-->
		<td>5</td><!--수량-->
		<td rowspan="2">시간엄수</td><!--픽업/배달-->
	</tr>
	<tr align="center">
		<td>아이스크림</td>
		<td>5</td>
	</tr>

<!--================= 4 ======================-->
	<tr align="center">
		<td>4</td><!--주문번호-->
		<td>1</td><!--배달상태-->
		<td>햄버거</td><!--주문메뉴-->
		<td>2</td><!--수량-->
		<td>ㅁㅁㅁ</td><!--픽업/배달-->
	</tr>


<!--================= 5 ======================-->
	<tr align="center">
		<td rowspan="2">5</td><!--주문번호-->
		<td rowspan="2">1</td><!--배달상태-->
		<td>햄버거</td><!--주문메뉴-->
		<td>1</td><!--수량-->
		<td rowspan="2">허리업</td><!--픽업/배달-->
	</tr>

	<tr align="center">
		<td>콜라</td><!--주문번호-->
		<td>2</td><!--수량-->
	</tr>
<!--==========================================-->
</table>
</body>
</html>
