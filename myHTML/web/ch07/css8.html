<!-- css8.html -->
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style type="text/css">
	h1{
        font-size: 30px;
    }
    .shadow1{
        color: red;
        text-shadow: 1px 1px black;
    }
    .shadow2{
        /*가로 세로 번짐 색상*/
        text-shadow: 5px 5px 3px #ffa500;
    }
    .shadow3{
        color: #fff;
        text-shadow: 7px -7px 20px #000;
    }
</style>
<title>제목입력</title>
</head>
<body>
    <h1 class="shadow1">HTML</h1>
	<h1 class="shadow2">CSS</h1>
	<h1 class="shadow3">JavaScript</h1>
</body>
</html>
