<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style type="text/css">
    table{
        caption-side: bottom;/*캡션을 제일 밑(바텀)으로 보냄*/
        border: 1px solid black;/*테이블의 테두리를 1px 실선 검정으로 설정*/
        border-collapse: collapse;/*테두리 여백없앰(두 줄 방지)*/
    }  
    th, td{
        border: 1px dotted pink;/*th, td의 테두리 1px 점선 핑크로 설정*/
        padding: 10px;/*여백 10px*/
        text-align: center;/*문자 가운데 정렬*/
    }
</style>
<title>제목입력</title>
</head>
<body>
    <h2>상품 구성</h2>

            <thead>
                <tr>
                    <th>용도</th>
					<th>중량</th>
					<th>갯수</t>
                        <th>가격</th>
                    </tr>
                </thead>
                <tbody>

</body>
</html>
