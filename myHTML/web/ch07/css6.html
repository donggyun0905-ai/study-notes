<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style type="text/css">
	p {
		width: 410px;
		border: 1px solid #222;
		padding: 10px;
		margin: 10px;
		font-size: 1.1em;
	}
	.center{
		text-align: center;
	}
	.justify{
		text-align: justify;
	}
	.small-line{
		line-height: 0.7;
	}
	.big-line{
		line-height: 2.5;
	}	
</style>
<title>제목입력</title>
</head>
<body>
	<p class="center">껍질에 붉은 빛이 돌아 <b>레드향</b>이라 불린다.</p>
	<p class="jistify">껍질에 붉은 빛이 돌아 <b>레드향</b>이라 불린다.</p>
	<p class="small-line">껍질에 붉은 빛이 돌아 <b>레드향</b>이라 불린다.</p>
	<p class="big-line">껍질에 붉은 빛이 돌아 <b>레드향</b>이라 불린다.</p>
</body>
</html>
