<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script type="text/javascript">
    function divide(a,b){
        if(b==0){
            return "나눗셈은 0으로 나누면 안되요."
        }
        c = a/b;
        return c;
    }
    d = divide(100,10);
    document.write("d: " + d + "<br>");
    d = divide(100,0);
    document.write("d: " + d);
</script>
</body>
</html>
