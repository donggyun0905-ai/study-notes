<!-- scr3.html -->
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>scr3</title>
</head>
<body>
<script type="text/javascript">
    a = '123';
    b = '456';
    document.write(a + b + "<br>"); // String형이라 더하면 붙여짐
    // 숫자 형태의 문자를 숫자타입으로 변형
    c = window.parseInt(a); //파싱함(변형) >> 정수로 변형함
    d = parseInt(b); //파싱함 >> 정수로 변형함
    document.write(c + d + "<br>");
    //사칙 연상자 + % -> 오칙연산자
    let useNumber = prompt("숫자를 입력하세요");
    if(useNumber%3 == 0){
        alert("3의 배수입니다");
    }
    else{
        alert("3의 배수가 아닙니다");
    }
    //삼항연산자 또는 다항연산자
    let answer = useNumber%3 == 0?"3의 배수입니다" : "3의 배수가 아닙니다";
    document.write(answer);
</script>

</body>
</html>
