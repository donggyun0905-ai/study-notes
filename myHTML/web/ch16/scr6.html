<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script type="text/javascript">
    //중첩 for 문
    for(i=0;i<3;i++){
        for(j =0;j<3;j++){
            document.write(i+"+" + j + "=" + (i +j) + "<br>");
        }//for2
    }//for1

    //break,continue
    for(i=1;i<10;i++){
        document.write(i+" ");
        if(i==5)
            break;
    }
    document.write("<br>");

    sum = 0;
    for(i=1;i<11;i++){
        if(i%2==0){
            sum+=i;
        }
    }
    document.write("sum: " + sum + "<br>");

    sum = 0;
    for(i=1;i<11;i++){
        if(i%2!=0){
            continue;
        }
        sum+=i;
    }
    document.write("sum: " + sum);

</script>

</body>
</html>
