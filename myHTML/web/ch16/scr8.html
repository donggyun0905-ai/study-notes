<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script type="text/javascript">
    //문제1. while 문과 break; 사용해서 1~20까지 범위 3의 배수 합 구하기
    sum = 0;
    i = 1;
    while(true){
        if(i == 20){break;}
        else if(i % 3 == 0){
            sum += i;
        }
        i++;
    }
    document.write("3의 배수 합 : " + sum + "<br>");

    //문제2. for문 이용해서 1~20까지 범위에 3의 배수 합 구하기
    sum = 0;
    for(i=1;i<=20;i++){
        if(i % 3 == 0){
            sum += i;
        }
    }
    document.write("3의 배수 합 : " + sum + "<br>");

    //문제3. for 문과 continue 이용해서 1~20까지 3의배수 구하기
    sum = 0;
    for(i=1;i<=20;i++){
        if(i % 3 != 0){
            continue;
        }
        sum += i;
    }
    document.write("3의 배수 합 : " + sum + "<br>");

</script>
</body>
</html>
