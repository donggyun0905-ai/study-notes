<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>HTML5 Stack Game</title>
    <style>
        /* 모바일 및 데스크톱 레이아웃 최적화 */
        body {
            margin: 0;
            padding: 0;
            background-color: #1e1e24;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 게임 화면 컨테이너 */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 80vh;
            max-height: 700px;
            background: linear-gradient(to bottom, #2b1055, #7597de);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }

        /* 캔버스 */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI 표시 레이어 */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* 클릭 이벤트가 캔버스로 전달되도록 설정 */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            padding: 25px;
        }

        /* 점수 표시판 */
        #score-container {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        #score-board {
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 20px;
            border-radius: 12px;
            backdrop-filter: blur(5px);
        }

        .score-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.8;
            margin-bottom: 2px;
        }

        .score-value {
            font-size: 2rem;
            font-weight: bold;
        }

        /* 게임오버 및 시작 화면 포개기 */
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s ease;
            border-radius: 20px;
            z-index: 10;
        }

        #overlay.hidden {
            display: none;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #fff;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
            letter-spacing: 2px;
        }

        .final-score {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: #ffcc00;
        }

        .btn-start {
            padding: 15px 40px;
            font-size: 1.3rem;
            font-weight: bold;
            background-color: #ff0055;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(255, 0, 85, 0.4);
            transition: transform 0.1s ease, background-color 0.2s;
        }

        .btn-start:active {
            transform: scale(0.95);
        }

        /* 조작 가이드 안내문 */
        #guide {
            text-align: center;
            font-size: 0.9rem;
            opacity: 0.6;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui-layer">
            <div id="score-container">
                <div id="score-board">
                    <div class="score-label">Score</div>
                    <div id="current-score" class="score-value">0</div>
                </div>
                <div id="score-board" style="text-align: right;">
                    <div class="score-label">Best</div>
                    <div id="best-score" class="score-value">0</div>
                </div>
            </div>
            <div id="guide">화면 아무 곳이나 터치하여 블록을 쌓으세요!</div>
        </div>

        <div id="overlay">
            <h1 id="title">STACK 3D</h1>
            <p id="result-msg" class="final-score">화면을 눌러 탑을 쌓아 올리세요!</p>
            <button id="start-btn" class="btn-start">게임 시작</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('start-btn');
        const overlay = document.getElementById('overlay');
        const titleText = document.getElementById('title');
        const resultMsg = document.getElementById('result-msg');
        const currentScoreSpan = document.getElementById('current-score');
        const bestScoreSpan = document.getElementById('best-score');

        // 해상도 보정
        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 게임 기본 상수
        const BLOCK_HEIGHT = 20;     // 블록의 높이
        const BASE_WIDTH = 160;      // 기본 기둥 가로 크기
        const BASE_DEPTH = 160;      // 기본 기둥 세로 크기
        const CAMERA_SPEED = 0.08;   // 카메라가 올라갈 때 따라가는 속도

        // 게임 시스템 변수
        let blocks = [];
        let debris = [];             // 잘려서 떨어지는 조각들
        let particles = [];          // 퍼펙트 성공 시 사방으로 튀는 파티클 효과 저장 배열
        let score = 0;
        let bestScore = 0;
        let isGameOver = false;
        let isStarted = false;
        
        let currentDirection = 'X';   // 'X' (우측하단->좌측상단 대각선) 혹은 'Z' (좌측하단->우측상단 대각선)
        let activeBlock = null;       // 현재 움직이는 블록
        let cameraY = 0;             // 카메라가 바라보는 Y 목표 높이
        let currentCameraY = 0;      // 현재 보간된 카메라 Y 높이
        let baseHue = 0;             // 레벨에 따라 변화하는 색상 값

        // 3D 투영(Isometric) 좌표 변환식
        // 등각 투영을 통해 평면에 3D 효과를 구현합니다.
        function toScreenCoords(x, y, z) {
            const centerX = canvas.width / 2;
            const centerY = canvas.height * 0.75; // 기둥을 화면 하단부에 배치
            
            // Isometric 변환 수식
            const screenX = centerX + (x - z) * Math.cos(Math.PI / 6);
            const screenY = centerY - y + (x + z) * Math.sin(Math.PI / 6);
            return { x: screenX, y: screenY };
        }

        // 3D 입체 블록 그리기 함수
        function drawBlock(x, y, z, w, h, d, hue, lightnessOffset = 0) {
            const topColor = `hsl(${hue}, 70%, ${50 + lightnessOffset}%)`;
            const leftColor = `hsl(${hue}, 70%, ${35 + lightnessOffset}%)`;
            const rightColor = `hsl(${hue}, 70%, ${42 + lightnessOffset}%)`;

            // 상단 면 꼭지점
            const p1 = toScreenCoords(x, y + h, z);
            const p2 = toScreenCoords(x + w, y + h, z);
            const p3 = toScreenCoords(x + w, y + h, z + d);
            const p4 = toScreenCoords(x, y + h, z + d);

            // 하단 면 꼭지점
            const p5 = toScreenCoords(x, y, z);
            const p6 = toScreenCoords(x + w, y, z);
            const p7 = toScreenCoords(x + w, y, z + d);
            const p8 = toScreenCoords(x, y, z + d);

            // 빈틈 방지를 위해 어두운 면 색상으로 전체 기둥 실루엣을 먼저 칠해줍니다.
            ctx.fillStyle = leftColor;
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.lineTo(p3.x, p3.y);
            ctx.lineTo(p7.x, p7.y);
            ctx.lineTo(p8.x, p8.y);
            ctx.lineTo(p5.x, p5.y);
            ctx.closePath();
            ctx.fill();

            // 1. 좌측면 그리기
            ctx.fillStyle = leftColor;
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p4.x, p4.y);
            ctx.lineTo(p8.x, p8.y);
            ctx.lineTo(p5.x, p5.y);
            ctx.closePath();
            ctx.fill();

            // 2. 우측면 그리기
            ctx.fillStyle = rightColor;
            ctx.beginPath();
            ctx.moveTo(p2.x, p2.y);
            ctx.lineTo(p3.x, p3.y);
            ctx.lineTo(p7.x, p7.y);
            ctx.lineTo(p6.x, p6.y);
            ctx.closePath();
            ctx.fill();

            // 3. 윗면 그리기
            ctx.fillStyle = topColor;
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.lineTo(p3.x, p3.y);
            ctx.lineTo(p4.x, p4.y);
            ctx.closePath();
            ctx.fill();
        }

        // 퍼펙트 성공 시 사방으로 튀는 불꽃 파티클 생성 함수
        function createPerfectParticles(x, y, z, w, d, hue) {
            // 블록 주변의 여러 꼭지점 위치 계산
            const centers = [
                toScreenCoords(x, y, z),
                toScreenCoords(x + w, y, z),
                toScreenCoords(x + w, y, z + d),
                toScreenCoords(x, y, z + d)
            ];

            // 30개의 생기발랄한 색상의 파티클 생성
            for (let i = 0; i < 30; i++) {
                // 임의의 발사 기점 설정 (주로 블록 중심 혹은 모서리 부근)
                const basePoint = centers[Math.floor(Math.random() * centers.length)];
                
                // 불꽃 조각의 크기, 속도, 수명 무작위 정의
                particles.push({
                    x: basePoint.x + (Math.random() * 20 - 10),
                    y: basePoint.y + (Math.random() * 10 - 5),
                    vx: (Math.random() * 8 - 4),
                    vy: (Math.random() * -10 - 4), // 위로 솟구치도록 음수 방향 속도 부여
                    size: Math.random() * 5 + 3,
                    alpha: 1,
                    decay: Math.random() * 0.02 + 0.015, // 페이드 아웃 속도
                    color: `hsl(${hue + Math.floor(Math.random() * 40 - 20)}, 100%, ${Math.random() * 20 + 60}%)` // 화려한 하이라이트 색상
                });
            }
        }

        // 게임 리셋 및 초기화
        function initGame() {
            blocks = [];
            debris = [];
            particles = [];
            score = 0;
            isGameOver = false;
            currentDirection = 'X';
            cameraY = 0;
            currentCameraY = 0;
            baseHue = Math.floor(Math.random() * 360);
            currentScoreSpan.textContent = score;

            // 바닥 기반 기둥 설치
            blocks.push({
                x: -BASE_WIDTH / 2,
                y: 0,
                z: -BASE_DEPTH / 2,
                w: BASE_WIDTH,
                h: 120, // 첫 밑바닥은 든든하게 높은 높이
                d: BASE_DEPTH,
                hue: baseHue
            });

            spawnNewBlock();
            
            overlay.classList.add('hidden');
            isStarted = true;
        }

        // 새로운 블록 생성 (이전 블록의 크기를 그대로 이어받음)
        function spawnNewBlock() {
            const topBlock = blocks[blocks.length - 1];
            const nextHue = (baseHue + blocks.length * 5) % 360;
            const nextY = topBlock.y + topBlock.h;

            // 새로 태어나는 블록의 좌표 및 물리 정보
            activeBlock = {
                x: topBlock.x,
                y: nextY,
                z: topBlock.z,
                w: topBlock.w,
                h: BLOCK_HEIGHT,
                d: topBlock.d,
                hue: nextHue,
                speed: 3 + Math.floor(score / 5) * 0.5, // 5단계를 깰 때마다 속도 증가
                dir: 1, // 이동 방향 (1: 순방향, -1: 역방향)
                offset: -260 // 스폰 시 외곽에서 슬라이드하며 시작
            };

            // 다음 움직일 축 결정 (좌우 번갈아 가며)
            currentDirection = (currentDirection === 'X') ? 'Z' : 'X';
            
            if (currentDirection === 'X') {
                activeBlock.x = topBlock.x + activeBlock.offset;
            } else {
                activeBlock.z = topBlock.z + activeBlock.offset;
            }

            // 카메라 타겟 높이 조정
            if (blocks.length > 4) {
                cameraY = (blocks.length - 4) * BLOCK_HEIGHT;
            }
        }

        // 스크린 터치/클릭으로 블록 쌓기 액션 처리
        function stackBlock() {
            if (!isStarted || isGameOver) return;

            const topBlock = blocks[blocks.length - 1];
            let isPlaced = false;

            if (currentDirection === 'X') {
                // X축 정렬 검사 및 슬라이싱 처리
                const diff = activeBlock.x - topBlock.x;
                const maxDiff = activeBlock.w;

                if (Math.abs(diff) < maxDiff) {
                    isPlaced = true;
                    let newX = activeBlock.x;
                    let newW = activeBlock.w - Math.abs(diff);

                    // [수정 사항] 퍼펙트 판정 허용 한계(Tolerance)를 기존 6px에서 10px로 완화했습니다.
                    if (Math.abs(diff) < 10) {
                        newX = topBlock.x;
                        newW = topBlock.w;
                        createPerfectParticles(newX, activeBlock.y, activeBlock.z, newW, activeBlock.d, activeBlock.hue);
                    } else {
                        if (diff > 0) {
                            // 우측으로 어긋남 -> 우측 파편 떨어뜨리기
                            createDebris(topBlock.x + newW, activeBlock.y, activeBlock.z, diff, activeBlock.h, activeBlock.d, activeBlock.hue);
                            newX = topBlock.x + diff;
                        } else if (diff < 0) {
                            // 좌측으로 어긋남 -> 좌측 파편 떨어뜨리기
                            createDebris(activeBlock.x, activeBlock.y, activeBlock.z, -diff, activeBlock.h, activeBlock.d, activeBlock.hue);
                            newX = topBlock.x;
                        }
                    }

                    // 블록 안착시키기
                    blocks.push({
                        x: newX, y: activeBlock.y, z: activeBlock.z,
                        w: newW, h: activeBlock.h, d: activeBlock.d,
                        hue: activeBlock.hue
                    });
                }
            } else {
                // Z축 정렬 검사 및 슬라이싱 처리
                const diff = activeBlock.z - topBlock.z;
                const maxDiff = activeBlock.d;

                if (Math.abs(diff) < maxDiff) {
                    isPlaced = true;
                    let newZ = activeBlock.z;
                    let newD = activeBlock.d - Math.abs(diff);

                    // [수정 사항] 퍼펙트 판정 허용 한계(Tolerance)를 기존 6px에서 10px로 완화했습니다.
                    if (Math.abs(diff) < 10) {
                        newZ = topBlock.z;
                        newD = topBlock.d;
                        createPerfectParticles(activeBlock.x, activeBlock.y, newZ, activeBlock.w, newD, activeBlock.hue);
                    } else {
                        if (diff > 0) {
                            // 뒤쪽으로 어긋남 -> 파편 처리
                            createDebris(activeBlock.x, activeBlock.y, topBlock.z + newD, activeBlock.w, activeBlock.h, diff, activeBlock.hue);
                            newZ = topBlock.z + diff;
                        } else if (diff < 0) {
                            // 앞쪽으로 어긋남 -> 파편 처리
                            createDebris(activeBlock.x, activeBlock.y, activeBlock.z, activeBlock.w, activeBlock.h, -diff, activeBlock.hue);
                            newZ = topBlock.z;
                        }
                    }

                    blocks.push({
                        x: activeBlock.x, y: activeBlock.y, z: newZ,
                        w: activeBlock.w, h: activeBlock.h, d: newD,
                        hue: activeBlock.hue
                    });
                }
            }

            if (isPlaced) {
                score++;
                currentScoreSpan.textContent = score;
                spawnNewBlock();
            } else {
                triggerGameOver();
            }
        }

        // 탈락하여 떨어져 나가는 블록 생성
        function createDebris(x, y, z, w, h, d, hue) {
            debris.push({
                x, y, z, w, h, d, hue,
                vy: 0,           // 낙하 속도
                gravity: 0.6     // 중력 가속도
            });
        }

        // 게임오버 트리거
        function triggerGameOver() {
            isGameOver = true;
            if (score > bestScore) {
                bestScore = score;
                bestScoreSpan.textContent = bestScore;
            }
            titleText.textContent = "GAME OVER";
            resultMsg.textContent = `최종 점수: ${score}층 쌓기 성공!`;
            startBtn.textContent = "다시 시도";
            overlay.classList.remove('hidden');
        }

        // 애니메이션 및 물리 업데이트 렌더링 루프
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. 부드러운 카메라 무빙 적용
            currentCameraY += (cameraY - currentCameraY) * CAMERA_SPEED;

            ctx.save();
            // 카메라가 올라갈 때 모든 그리기 좌표계를 하단으로 전이시킴
            ctx.translate(0, currentCameraY);

            // 2. 쌓여 있는 모든 기둥 렌더링
            blocks.forEach((block, index) => {
                // 화면 최적화를 위해 너무 밑에 있는 블록은 단순 연산/드로잉에서 살짝 보정해도 됩니다.
                drawBlock(block.x, block.y, block.z, block.w, block.h, block.d, block.hue);
            });

            // 3. 현재 조종되고 있는 탑쌓기 블록 렌더링 및 물리 처리
            if (!isGameOver && activeBlock) {
                // 왕복 진동 운동 처리
                activeBlock.offset += activeBlock.speed * activeBlock.dir;
                if (Math.abs(activeBlock.offset) > 260) {
                    activeBlock.dir *= -1; // 반사
                }

                const topBlock = blocks[blocks.length - 1];
                if (currentDirection === 'X') {
                    activeBlock.x = topBlock.x + activeBlock.offset;
                } else {
                    activeBlock.z = topBlock.z + activeBlock.offset;
                }

                drawBlock(activeBlock.x, activeBlock.y, activeBlock.z, activeBlock.w, activeBlock.h, activeBlock.d, activeBlock.hue, 5);
            }

            // 4. 잘린 파편들 떨어지는 연산 및 렌더링
            for (let i = debris.length - 1; i >= 0; i--) {
                const deb = debris[i];
                deb.vy += deb.gravity;
                deb.y -= deb.vy; // Y축 아래 방향으로 하강

                drawBlock(deb.x, deb.y, deb.z, deb.w, deb.h, deb.d, deb.hue, -10);

                // 화면 저 밑으로 내려가면 배열에서 영구 제외
                if (deb.y < cameraY - 400) {
                    debris.splice(i, 1);
                }
            }

            ctx.restore(); // 카메라이펙트 전이계 해제 후, 절대좌표 기반 파티클 렌더링 진행

            // 5. 퍼펙트 파티클 이펙트 업데이트 및 렌더링 (화면 절대좌표 기준)
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                
                // 가속도 및 위치 계산 (중력 적용)
                p.vy += 0.35; // 중력
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= p.decay; // 잔상 퇴색

                // 수명이 다했는지 확인
                if (p.alpha <= 0 || p.y > canvas.height) {
                    particles.splice(i, 1);
                    continue;
                }

                // 글로우 효과 및 파티클 그리기
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            requestAnimationFrame(gameLoop);
        }

        // 스페이스바 및 컨테이너 전역 클릭/터치 이벤트 리스너
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (overlay.classList.contains('hidden')) {
                    stackBlock();
                } else {
                    initGame();
                }
            }
        });

        // 캔버스를 포함한 상위 컨테이너 터치 시 블록 낙하 동작 처리
        document.getElementById('game-container').addEventListener('mousedown', (e) => {
            // 버튼을 누른 게 아닐 때만 블록 쌓기 액션 실행
            if (e.target !== startBtn) {
                stackBlock();
            }
        });

        // 모바일 터치 이벤트 바인딩
        document.getElementById('game-container').addEventListener('touchstart', (e) => {
            if (e.target !== startBtn) {
                e.preventDefault(); // 스크롤 등 기본 터치 모션 방지
                stackBlock();
            }
        }, { passive: false });

        startBtn.addEventListener('click', initGame);

        // 루프 구동
        gameLoop();
    </script>
</body>
</html>
