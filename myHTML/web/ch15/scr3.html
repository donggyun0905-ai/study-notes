<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>scr3</title>
</head>
<body>
    <script type="text/javascript">
        //클래스명은 첫번째 철자가 대문자
        //Windows 클래스로 생성된 객체를 Window window = new Window() <- 내부적 제공
        //window는 생략 가능
        alert("안녕하세요");
        let reply = confirm("정말 결제를 하시겠습니까?");
        let name = prompt("이름을 입력하세요", "익명");
        //브라우저에 출력
        //Document클래스가 있고 Document document = new Document() <- 내부적 제공
        //document는 눈에 보이는 객체들
        //그 document에 써라. 일반적으로 기능은 동사
        document.write("reply:" + reply + "<br>");
        document.write("name:" + name + "<br>");
        document.write("<h1>반갑습니다.<h1>");
        console.log("F12에서 확인하세요");
    </script>
</body>
</html>
