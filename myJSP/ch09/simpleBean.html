<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<script type="text/javascript">
	function send() {
		//alert('테스트');
		f = document.frm;
		//document에 있는 모든 form은 자동으로 배열이 됨.
		//f = document.forms[0];
		//alert(f.msg.value);
		if(f.msg.value.length==0){
			alert('msg를 입력하세요');
			f.msg.focus();
			return;//function 빠져나감.
		}
		if(f.cnt.value.length==0){
			alert('cnt를 입력하세요');
			f.cnt.focus();
			return;
		}
		f.action = "simpleBean2.jsp";
		f.method = "post";
		f.submit();
	}
</script>
</head>
<body>
<h1>빈즈 액션 태그 Example</h1>
<form name="frm" action="simpleBean1.jsp">
msg : <input name="msg" value="빈을 만들자."><br/>
cnt : <input name="cnt" value="10"><br/>
<input type="submit" value="Send1">
<!-- button type은 반드시 onclick 이벤트 실행을 해야함.  -->
<input type="button" value="Send2" onclick="send()">
</form>
</body>
</html>
