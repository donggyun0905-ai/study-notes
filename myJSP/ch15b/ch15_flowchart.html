<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ch15 JSP Board FlowChart</title>
<script>!function(){var k='ch15-theme',o=['soft','deep','light'];var t=localStorage.getItem(k);if(o.indexOf(t)<0)t='soft';document.documentElement.setAttribute('data-ch15-theme',t);}();</script>
<link href="ch15-theme.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
  .flow-svg {
    width: 100%;
    height: auto;
    filter: drop-shadow(0 2px 20px rgba(0,0,0,0.3));
    font-family: 'Noto Sans KR', sans-serif;
  }
  /* Dark mode color overrides for SVG */
  .box-blue   { fill: #162d50; stroke: #3a7bd5; }
  .box-teal   { fill: #0a3d30; stroke: #2ecc94; }
  .box-purple { fill: #2a1f4e; stroke: #8b6fc0; }
  .box-coral  { fill: #3d1e14; stroke: #e07850; }
  .box-amber  { fill: #3a2a08; stroke: #d4a030; }
  .box-red    { fill: #3a1212; stroke: #e05050; }
  .box-pink   { fill: #3a1428; stroke: #d4537e; }
  .box-gray   { fill: #2a2a2e; stroke: #6a6a70; }
  .box-gray-dash { fill: #22222a; stroke: #5a5a66; stroke-dasharray: 6 3; }

  .t-title  { fill: #e8e8f0; font-size: 14px; font-weight: 500; font-family: 'Noto Sans KR', sans-serif; }
  .t-sub    { fill: #9a9ab0; font-size: 12px; font-weight: 400; font-family: 'Noto Sans KR', sans-serif; }
  .t-label  { fill: #8888a0; font-size: 12px; font-weight: 400; font-family: 'Noto Sans KR', sans-serif; }
  .t-yes    { fill: #2ecc94; font-size: 12px; font-weight: 500; font-family: 'Noto Sans KR', sans-serif; }
  .t-no     { fill: #e05050; font-size: 12px; font-weight: 500; font-family: 'Noto Sans KR', sans-serif; }
  .t-redirect { fill: #2ecc94; font-size: 12px; font-weight: 400; font-family: 'Noto Sans KR', sans-serif; }
  .t-section  { fill: #7878a0; font-size: 14px; font-weight: 500; font-family: 'Noto Sans KR', sans-serif; }

  .arr-default { stroke: #5a5a78; stroke-width: 1.5; }
  .arr-teal    { stroke: #2ecc94; stroke-width: 1.5; }
  .arr-blue    { stroke: #5a9ae0; stroke-width: 1.5; }
  .arr-amber   { stroke: #d4a030; stroke-width: 1.5; }
  .arr-green   { stroke: #2ecc94; stroke-width: 1.5; }
  .arr-red     { stroke: #e05050; stroke-width: 1.5; }

  .dash-line { stroke: #4a4a60; stroke-width: 0.5; stroke-dasharray: 4 3; }

  .legend-title { fill: #c0c0d0; font-size: 13px; font-weight: 500; font-family: 'Noto Sans KR', sans-serif; }
  .legend-text  { fill: #9090a8; font-size: 11px; font-weight: 400; font-family: 'Noto Sans KR', sans-serif; }
</style>
</head>
<body class="min-h-screen bg-[var(--ch15-page)] px-5 py-10 font-sans antialiased text-[var(--ch15-text)]">
<div class="mx-auto w-full max-w-[820px]">
<h1 class="mb-2 text-center text-[22px] font-bold tracking-tight text-[var(--ch15-heading)]">Ch15 · JSP Board FlowChart</h1>
<p class="mb-8 text-center text-[13px] text-[var(--ch15-muted)]">JSP 게시판 페이지 흐름도 — post / list / read / update / reply / delete</p>

</marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">

</marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">

</marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">

<path d="M2 1L8 5L2 9" fill="none" stroke="#e05050" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- ② post.jsp -->
